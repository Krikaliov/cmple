name: Build and Tests

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: '30 5 * * 1-5'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: clang
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "tests=${{ github.workspace }}/tests/testing_" >> "$GITHUB_OUTPUT"
    
    - name: Configure CMake for testing maths
      working-directory: ${{ steps.strings.outputs.tests }}maths
      run: cmake -B build -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
    
    - name: Running CMake for testing maths
      working-directory: ${{ steps.strings.outputs.tests }}maths
      run: cmake --build build
    
    - name: Running testing maths
      working-directory: ${{ steps.strings.outputs.tests }}maths
      run: |
        ./build/test_matrix
        ./build/test_fact
        ./build/test_array
    
    - name: Configure CMake for testing strings
      working-directory: ${{ steps.strings.outputs.tests }}strings
      run: cmake -B build -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
    
    - name: Running CMake for testing strings
      working-directory: ${{ steps.strings.outputs.tests }}strings
      run: cmake --build build
    
    - name: Running testing strings
      working-directory: ${{ steps.strings.outputs.tests }}strings
      run: |
        ./build/test_date
        ./build/test_string
